<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 视频中文化工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ---- 设计 token：集中管理配色，便于日后统一换主题 ---- */
      :root {
        --color-bg: #0b1220;
        --color-surface: #161f33;
        --color-surface-alt: #101827;
        --color-border: #26324a;
        --color-border-strong: #3a4763;
        --color-text: #e7eaf2;
        --color-text-muted: #97a1b8;
        --color-text-subtle: #6b7690;
        --color-primary: #3db9cf;
        --color-primary-strong: #0797b9;
        --color-primary-soft: #009fbb82;
        --color-success: #3ecf8e;
        --color-success-strong: #219f6c;
        --color-success-soft: rgba(62, 207, 142, 0.14);
        --color-danger: #ff7a7a;
        --color-danger-soft: rgba(255, 122, 122, 0.14);
      }

      body {
        background: var(--color-bg);
        color: var(--color-text);
      }

      /* 字幕叠层字体：霞鹜文楷等宽，缺失降级系统默认。 */
      #subtitle-overlay {
        font-family: "LXGW WenKai Mono", "LXGW WenKai", monospace;
      }

      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 1rem;
      }
      .card.locked {
        opacity: 0.55;
        pointer-events: none;
        filter: grayscale(0.4);
      }

      .step-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5rem;
        height: 1.5rem;
        flex-shrink: 0;
        border-radius: 999px;
        background: var(--color-surface-alt);
        border: 1px solid var(--color-border-strong);
        color: var(--color-text-muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .section-title {
        color: var(--color-text);
      }
      .helper-text {
        color: var(--color-text-muted);
      }
      .field-label {
        color: var(--color-text-muted);
      }

      .input,
      .select {
        background: var(--color-surface-alt);
        border: 1px solid var(--color-border);
        color: var(--color-text);
      }
      .input:focus,
      .select:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--color-primary-soft);
      }

      .color-input {
        width: 2.25rem;
        height: 2.25rem;
        padding: 2px;
        border-radius: 0.5rem;
        border: 1px solid var(--color-border);
        background: var(--color-surface-alt);
      }

      .btn {
        border-radius: 0.6rem;
        font-weight: 600;
        transition:
          background 0.15s,
          opacity 0.15s,
          border-color 0.15s;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--color-primary-strong);
        color: #04101c;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--color-primary);
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--color-border-strong);
        color: var(--color-text-muted);
      }
      .btn-ghost:hover:not(:disabled) {
        color: var(--color-text);
        border-color: var(--color-text-muted);
      }

      /* 自定义开关，替代原生 checkbox 外观 */
      .switch-wrap {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
      }
      .switch-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch-track {
        position: relative;
        width: 2.25rem;
        height: 1.25rem;
        flex-shrink: 0;
        border-radius: 999px;
        background: var(--color-surface-alt);
        border: 1px solid var(--color-border-strong);
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .switch-thumb {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: var(--color-text-muted);
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .switch-input:checked + .switch-track {
        background: var(--color-primary-soft);
        border-color: var(--color-primary);
      }
      .switch-input:checked + .switch-track .switch-thumb {
        transform: translateX(1rem);
        background: var(--color-primary);
      }
      .switch-label {
        color: var(--color-text-muted);
        font-size: 0.85rem;
      }
      .switch-wrap.disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      /* 导出方式：卡片式选项，替代纯色按钮堆叠 */
      .option-card {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        text-align: left;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid var(--color-border);
        background: var(--color-surface-alt);
        color: var(--color-text);
      }
      .option-card:hover:not(:disabled) {
        border-color: var(--color-primary);
      }
      .option-card.option-primary {
        border-color: var(--color-success-strong);
        background: var(--color-success-soft);
      }
      .option-card:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .option-title {
        font-weight: 600;
        font-size: 0.85rem;
      }
      .option-desc {
        font-size: 0.72rem;
        color: var(--color-text-muted);
      }

      .step-chip {
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        font-size: 0.7rem;
        color: var(--color-text-subtle);
        background: var(--color-surface-alt);
        border: 1px solid var(--color-border);
        white-space: nowrap;
      }
      .step-chip.active {
        color: var(--color-primary);
        border-color: var(--color-primary);
        background: var(--color-primary-soft);
      }
      .step-chip.done {
        color: var(--color-success);
        border-color: var(--color-success);
        background: var(--color-success-soft);
      }

      .progress-track {
        background: var(--color-surface-alt);
        border-radius: 999px;
        overflow: hidden;
        height: 0.4rem;
      }
      .progress-bar {
        background: var(--color-primary-strong);
        height: 100%;
        transition: width 0.2s;
      }

      .alert {
        border-radius: 0.6rem;
        padding: 0.55rem 0.8rem;
        font-size: 0.8rem;
      }
      .alert-info {
        background: var(--color-primary-soft);
        color: var(--color-primary);
      }
      .alert-error {
        background: var(--color-danger-soft);
        color: var(--color-danger);
      }

      .chip {
        display: inline-block;
        border-radius: 999px;
        border: 1px solid var(--color-border);
        background: var(--color-surface-alt);
        color: var(--color-text-muted);
        padding: 0.1rem 0.55rem;
        font-size: 0.72rem;
      }

      .download-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        border-radius: 0.6rem;
        padding: 0.55rem 0.8rem;
        font-size: 0.85rem;
        font-weight: 600;
        background: var(--color-success-strong);
        color: #03150e;
        transition: background 0.15s;
      }
      .download-link:hover {
        background: var(--color-success);
      }

      input[type="range"] {
        accent-color: var(--color-primary);
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="mx-auto max-w-6xl px-4 py-8 lg:px-6">
      <header class="mb-6 flex items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold section-title">YouTube 视频中文化工具</h1>
          <p class="mt-1 text-sm helper-text">粘贴视频链接，自动获取字幕、翻译并烧录导出中文视频</p>
        </div>
        <button
          id="clear-cache-btn"
          class="btn btn-ghost shrink-0 px-3 py-2 text-xs disabled:opacity-50"
        >
          清理缓存
        </button>
      </header>

      <div class="space-y-6">
        <!-- Step 1：输入 -->
        <section class="card p-5">
          <div class="mb-4 flex items-center gap-2">
            <span class="step-badge">1</span>
            <h2 class="text-sm font-semibold section-title">输入视频</h2>
          </div>

          <input
            id="url-input"
            type="text"
            placeholder="粘贴 YouTube 视频链接…"
            class="input w-full rounded-lg px-3 py-2.5 text-sm"
          />

          <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-3">
            <label class="switch-wrap">
              <input id="translate-check" type="checkbox" class="switch-input" checked />
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">翻译成中文</span>
            </label>
            <label id="ai-segment-wrap" class="switch-wrap">
              <input id="ai-segment-check" type="checkbox" class="switch-input" />
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">AI 智能断句（更贴合语义，消耗更多 token）</span>
            </label>
            <label class="switch-wrap">
              <input id="auto-export-check" type="checkbox" class="switch-input" checked />
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">自动烧录导出并下载</span>
            </label>
            <button
              id="prepare-btn"
              class="btn btn-primary ml-auto px-6 py-2.5 text-sm disabled:opacity-50"
            >
              开始处理
            </button>
          </div>

          <p id="status" class="alert alert-info mt-4 hidden"></p>

          <div id="prepare-progress" class="mt-4 hidden">
            <div id="prepare-steps" class="mb-2 flex flex-wrap items-center gap-1.5">
              <span class="step-chip" data-stage="download">下载视频</span>
              <span class="step-chip" data-stage="subtitle">获取字幕</span>
              <span class="step-chip" data-stage="segment">断句</span>
              <span class="step-chip" data-stage="translate">翻译</span>
            </div>
            <div class="progress-track">
              <div id="prepare-bar" class="progress-bar" style="width: 0%"></div>
            </div>
            <p id="prepare-progress-text" class="mt-1 text-xs helper-text"></p>
          </div>
        </section>

        <!-- Step 2：预览与样式 -->
        <section id="workspace-preview" class="card locked p-5">
          <div class="mb-4 flex items-center gap-2">
            <span class="step-badge">2</span>
            <h2 class="text-sm font-semibold section-title">预览与字幕样式</h2>
            <span id="preview-lock-hint" class="chip">完成第 1 步后解锁</span>
          </div>

          <div class="grid gap-6 lg:grid-cols-3">
            <!-- 视频预览 -->
            <div class="lg:col-span-2">
              <div id="video-wrap" class="relative overflow-hidden rounded-xl bg-black">
                <video id="player" class="w-full" controls></video>
                <div
                  id="subtitle-overlay"
                  class="pointer-events-none absolute bottom-6 left-1/2 hidden max-w-[96%] -translate-x-1/2 whitespace-pre-wrap text-center leading-snug"
                ></div>
              </div>

              <div
                class="mt-3 flex items-center gap-3 rounded-lg p-3"
                style="background: var(--color-surface-alt); border: 1px solid var(--color-border)"
              >
                <img
                  id="meta-thumbnail"
                  class="hidden h-14 w-24 shrink-0 rounded object-cover"
                  alt="视频缩略图"
                />
                <div class="min-w-0 flex-1">
                  <p id="meta" class="truncate text-sm section-title"></p>
                  <a
                    id="meta-source"
                    class="hidden truncate text-xs"
                    style="color: var(--color-primary)"
                    target="_blank"
                    rel="noopener noreferrer"
                  ></a>
                </div>
              </div>
            </div>

            <!-- 样式设置 -->
            <div class="space-y-5">
              <div>
                <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide helper-text">
                  预览语言
                </h3>
                <select id="preview-mode" class="select w-full rounded-lg px-2 py-1.5 text-sm">
                  <option value="bilingual">双语</option>
                  <option value="translated" selected>中文</option>
                  <option value="original">原文</option>
                </select>
              </div>

              <div>
                <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide helper-text">
                  字体样式
                </h3>

                <label class="mb-3 block text-xs field-label">
                  字号 <span id="font-size-val" class="chip">42</span>
                  <input
                    id="font-size"
                    type="range"
                    min="16"
                    max="72"
                    value="42"
                    class="mt-1 w-full"
                  />
                </label>

                <div class="mb-3 flex items-center justify-between text-xs field-label">
                  <span>文字颜色</span>
                  <input id="text-color" type="color" value="#ffffff" class="color-input" />
                </div>

                <div class="mb-3 flex items-center justify-between text-xs field-label">
                  <span>背景颜色</span>
                  <input id="bg-color" type="color" value="#000000" class="color-input" />
                </div>

                <label class="block text-xs field-label">
                  背景不透明度 <span id="bg-opacity-val" class="chip">0.6</span>
                  <input
                    id="bg-opacity"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.6"
                    class="mt-1 w-full"
                  />
                </label>
              </div>
            </div>
          </div>
        </section>

        <!-- Step 3：导出 -->
        <section id="workspace-export" class="card locked p-5">
          <div class="mb-4 flex items-center gap-2">
            <span class="step-badge">3</span>
            <h2 class="text-sm font-semibold section-title">导出视频</h2>
            <span id="export-lock-hint" class="chip">完成第 1 步后解锁</span>
          </div>

          <label class="mb-4 block text-xs field-label">
            字幕语言（烧录）
            <select
              id="burn-sub-mode"
              class="select mt-1 w-full max-w-xs rounded-lg px-2 py-1.5 text-sm"
            >
              <option value="translated" selected>中文</option>
              <option value="bilingual">双语</option>
            </select>
          </label>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <button id="export-original" class="option-card disabled:opacity-50">
              <span class="option-title">原声版</span>
              <span class="option-desc">仅烧录字幕，保留视频原声</span>
            </button>
            <button id="export-both" class="option-card option-primary disabled:opacity-50">
              <span class="option-title">原声 + 中文配音</span>
              <span class="option-desc">一次导出两个版本，含 AI 配音</span>
            </button>
          </div>

          <div id="export-progress" class="mt-4 hidden">
            <div class="progress-track">
              <div id="export-bar" class="progress-bar" style="width: 0%"></div>
            </div>
          </div>
          <p id="export-status" class="mt-2 text-xs helper-text"></p>
          <div id="export-links" class="mt-3 hidden grid gap-2 sm:grid-cols-2"></div>
        </section>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
